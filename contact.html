<!-- contact.html: Contact section -->
<section id="contact">
  <h2 class="section-title">CONTACT <span>ME</span></h2>
  <div class="contact">
    <p>Have a project or opportunity? Send a message and let's create something extraordinary.</p>
    <form id="contact-form">
      <input id="contact-name" type="text" placeholder=" Your Name" required>
      <input id="contact-email" type="email" placeholder="Your Gmail" required>
      <textarea id="contact-message" placeholder="Message me" required></textarea>
      <button class="btn" type="submit">Release Message ⚡</button>
    </form>
    <p class="form-note">This form opens your default email application. Replace the recipient address in js/main.js before publishing.</p>
  </div>
</section>
